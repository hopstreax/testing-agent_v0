[project]
name = "testing-agent-backend"
version = "0.1.0"
description = "Autonomous website testing agent backend powered by Solari Browser and Patchright"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "solari-browser>=0.1.3",
    "patchright>=1.62.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
